name: tinyscheg

channels:
  - conda-forge

dependencies:
  # The reference interpreter. Development runs also use PyPy 3.11 (ADR 0033: python tools/setup_pypy.py), so the
  # code must stay Python 3.11-compatible; tools/setup_pypy.py pins the same library versions for it.
  - python=3.13

  # YAML input parsing
  - pyyaml
  # XLSX (Excel) and ODS (OpenDocument) output
  - openpyxl
  - odfpy

  # Testing (development only, not used by the program itself)
  - pytest=9.0.3

  - pip
  - pip:
      # Documentation site (docs only, not used by the program itself)
      - mkdocs==1.6.1
      - mkdocs-material==9.7.6
      # Renders GitHub-style alerts (> [!NOTE]) so docs look right both on GitHub and on the site
      - markdown-callouts==0.4.0
