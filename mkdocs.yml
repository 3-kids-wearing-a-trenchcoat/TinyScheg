      - 0042 Next-period warning: decisions/0042-warn-when-the-next-period-cant-be-filled.md
      - 0043 One process per core: decisions/0043-one-process-per-physical-core.md
      - 0044 Best whole-slot multiplier by tangents: decisions/0044-best-whole-slot-multiplier-by-tangents.md
      - 0045 A rest look-ahead: decisions/0045-rest-lookahead.md
      - 0046 Whole-slot sets from each worker's domain: decisions/0046-whole-slot-sets-from-each-workers-own-domain.md
      - 0047 Choosing the role-aware bound: decisions/0047-choosing-the-role-aware-bound.md
      - 0048 An audit that only observes: decisions/0048-an-audit-that-only-observes.md
      - 0049 Partners in the audit: decisions/0049-partners-in-the-audit.md
      - 0050 A fix harms only where a worker's situation gets worse: decisions/0050-a-fix-harms-only-where-a-workers-own-situation-gets-worse.md
      - 0051 The audit after reading cards by hand: decisions/0051-the-audit-after-reading-cards-by-hand.md
      - 0052 A worker panel as a check on the audit: decisions/0052-a-worker-panel-as-a-check-on-the-audit.md

markdown_extensions:
  - admonition
  - github-callouts           # GitHub-style alerts (> [!NOTE]), from markdown-callouts
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:      # $...$ and $$...$$ math, rendered by MathJax
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:        # - [ ] / - [x] checkboxes, as on GitHub
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
